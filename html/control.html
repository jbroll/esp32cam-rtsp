<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32-CAM Control</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin: 10px 0;
            font-size: 1.5em;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 15px;
        }
        @media (max-width: 800px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        .stream-panel {
            background: #000;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .stream-container {
            position: relative;
            width: 100%;
            background: #222;
            border-radius: 4px;
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stream-container img {
            max-width: 100%;
            max-height: 70vh;
            display: none;
        }
        .stream-container img.active {
            display: block;
        }
        .stream-placeholder {
            color: #666;
            font-size: 1.2em;
        }
        .stream-container img.active + .stream-placeholder {
            display: none;
        }
        .stream-controls {
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 2px;
        }
        .btn-primary {
            background: #2196F3;
            color: white;
        }
        .btn-success {
            background: #4CAF50;
            color: white;
        }
        .btn-danger {
            background: #f44336;
            color: white;
        }
        .btn-secondary {
            background: #666;
            color: white;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .settings-panel {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .settings-panel h2 {
            margin: 0 0 10px 0;
            font-size: 1.1em;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        .setting-group {
            margin-bottom: 15px;
        }
        .setting-group h3 {
            margin: 0 0 8px 0;
            font-size: 0.95em;
            color: #888;
        }
        .setting-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }
        .setting-row label {
            flex: 1;
            font-size: 0.85em;
        }
        .setting-row input[type="number"],
        .setting-row select {
            width: 100px;
            padding: 4px;
            border: 1px solid #444;
            border-radius: 3px;
            background: #333;
            color: #e0e0e0;
        }
        .setting-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }
        .setting-row input[type="range"] {
            width: 100px;
        }
        .actions {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #444;
        }
        .actions .btn {
            width: 100%;
            margin-bottom: 5px;
        }
        .status {
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 0.85em;
        }
        .status.success { background: #1b5e20; }
        .status.error { background: #b71c1c; }
        .status.loading { background: #0d47a1; }
        .links {
            margin-top: 10px;
            text-align: center;
            font-size: 0.85em;
        }
        .links a {
            color: #64b5f6;
            margin: 0 10px;
        }
        .motion-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 8px;
            background: #666;
        }
        .motion-indicator.detected {
            background: #f44336;
            box-shadow: 0 0 8px #f44336;
        }
        .motion-indicator.ready {
            background: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ESP32-CAM Control</h1>

        <div class="main-grid">
            <div class="stream-panel">
                <div class="stream-container">
                    <img id="stream" alt="Camera Stream">
                    <div class="stream-placeholder">Stream stopped</div>
                </div>
                <div class="stream-controls">
                    <button id="btnStreamToggle" class="btn btn-success" onclick="toggleStream()">Start Stream</button>
                    <button class="btn btn-secondary" onclick="snapshot()">Snapshot</button>
                </div>
            </div>

            <div class="settings-panel">
                <h2>Camera Settings</h2>

                <div class="setting-group">
                    <h3>Image</h3>
                    <div class="setting-row">
                        <label>Resolution</label>
                        <select id="fs">
                            <option value="QQVGA (160x120)">QQVGA</option>
                            <option value="QCIF (176x144)">QCIF</option>
                            <option value="HQVGA (240x176)">HQVGA</option>
                            <option value="QVGA (320x240)">QVGA</option>
                            <option value="CIF (400x296)">CIF</option>
                            <option value="VGA (640x480)">VGA</option>
                            <option value="SVGA (800x600)">SVGA</option>
                            <option value="XGA (1024x768)">XGA</option>
                            <option value="SXGA (1280x1024)">SXGA</option>
                            <option value="UXGA (1600x1200)">UXGA</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label>Quality (1-100)</label>
                        <input type="number" id="q" min="1" max="100">
                    </div>
                    <div class="setting-row">
                        <label>Frame interval (ms)</label>
                        <input type="number" id="fd" min="10" max="10000">
                    </div>
                </div>

                <div class="setting-group">
                    <h3>Adjustments</h3>
                    <div class="setting-row">
                        <label>Brightness</label>
                        <input type="range" id="b" min="-2" max="2" oninput="this.nextElementSibling.textContent=this.value">
                        <span>0</span>
                    </div>
                    <div class="setting-row">
                        <label>Contrast</label>
                        <input type="range" id="c" min="-2" max="2" oninput="this.nextElementSibling.textContent=this.value">
                        <span>0</span>
                    </div>
                    <div class="setting-row">
                        <label>Saturation</label>
                        <input type="range" id="s" min="-2" max="2" oninput="this.nextElementSibling.textContent=this.value">
                        <span>0</span>
                    </div>
                    <div class="setting-row">
                        <label>Effect</label>
                        <select id="e">
                            <option value="Normal">Normal</option>
                            <option value="Negative">Negative</option>
                            <option value="Grayscale">Grayscale</option>
                            <option value="Red tint">Red tint</option>
                            <option value="Green tint">Green tint</option>
                            <option value="Blue tint">Blue tint</option>
                            <option value="Sepia">Sepia</option>
                        </select>
                    </div>
                </div>

                <div class="setting-group">
                    <h3>White Balance</h3>
                    <div class="setting-row">
                        <label>Auto WB</label>
                        <input type="checkbox" id="wb">
                    </div>
                    <div class="setting-row">
                        <label>AWB Gain</label>
                        <input type="checkbox" id="awbg">
                    </div>
                    <div class="setting-row">
                        <label>WB Mode</label>
                        <select id="wbm">
                            <option value="Auto">Auto</option>
                            <option value="Sunny">Sunny</option>
                            <option value="Cloudy">Cloudy</option>
                            <option value="Office">Office</option>
                            <option value="Home">Home</option>
                        </select>
                    </div>
                </div>

                <div class="setting-group">
                    <h3>Exposure</h3>
                    <div class="setting-row">
                        <label>Auto Exposure</label>
                        <input type="checkbox" id="ec">
                    </div>
                    <div class="setting-row">
                        <label>AEC DSP</label>
                        <input type="checkbox" id="aec2">
                    </div>
                    <div class="setting-row">
                        <label>AE Level</label>
                        <input type="range" id="ael" min="-2" max="2" oninput="this.nextElementSibling.textContent=this.value">
                        <span>0</span>
                    </div>
                    <div class="setting-row">
                        <label>Exposure</label>
                        <input type="number" id="aecv" min="9" max="1200">
                    </div>
                </div>

                <div class="setting-group">
                    <h3>Gain</h3>
                    <div class="setting-row">
                        <label>Auto Gain</label>
                        <input type="checkbox" id="gc">
                    </div>
                    <div class="setting-row">
                        <label>AGC Gain</label>
                        <input type="number" id="agcg" min="0" max="30">
                    </div>
                    <div class="setting-row">
                        <label>Gain Ceiling</label>
                        <select id="gcl">
                            <option value="2X">2X</option>
                            <option value="4X">4X</option>
                            <option value="8X">8X</option>
                            <option value="16X">16X</option>
                            <option value="32X">32X</option>
                            <option value="64X">64X</option>
                            <option value="128X">128X</option>
                        </select>
                    </div>
                </div>

                <div class="setting-group">
                    <h3>Corrections</h3>
                    <div class="setting-row">
                        <label>BPC</label>
                        <input type="checkbox" id="bpc">
                    </div>
                    <div class="setting-row">
                        <label>WPC</label>
                        <input type="checkbox" id="wpc">
                    </div>
                    <div class="setting-row">
                        <label>Gamma</label>
                        <input type="checkbox" id="rg">
                    </div>
                    <div class="setting-row">
                        <label>Lens Corr</label>
                        <input type="checkbox" id="lenc">
                    </div>
                </div>

                <div class="setting-group">
                    <h3>Orientation</h3>
                    <div class="setting-row">
                        <label>H-Mirror</label>
                        <input type="checkbox" id="hm">
                    </div>
                    <div class="setting-row">
                        <label>V-Flip</label>
                        <input type="checkbox" id="vm">
                    </div>
                    <div class="setting-row">
                        <label>DCW</label>
                        <input type="checkbox" id="dcw">
                    </div>
                    <div class="setting-row">
                        <label>Color Bar</label>
                        <input type="checkbox" id="cb">
                    </div>
                </div>

                <div class="setting-group">
                    <h3>Motion Detection</h3>
                    <div class="setting-row">
                        <label>Enable</label>
                        <input type="checkbox" id="me">
                        <span id="motionStatus" class="motion-indicator"></span>
                    </div>
                    <div class="setting-row">
                        <label>Sensitivity</label>
                        <input type="range" id="ms" min="1" max="100" oninput="this.nextElementSibling.textContent=this.value">
                        <span>50</span>
                    </div>
                    <div class="setting-row">
                        <label>Cooldown (ms)</label>
                        <input type="number" id="mc" min="100" max="60000">
                    </div>
                    <div class="setting-row">
                        <label>Threshold (%)</label>
                        <input type="number" id="mt" min="1" max="100">
                    </div>
                </div>

                <div class="actions">
                    <button class="btn btn-primary" onclick="saveToFlash()">Save to Flash</button>
                    <button class="btn btn-secondary" onclick="loadSettings()">Reload</button>
                </div>

                <div id="status" class="status" style="display:none;"></div>

                <div class="links">
                    <a href="/">Status</a>
                    <a href="/config">WiFi Config</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let streaming = false;
        const streamImg = document.getElementById('stream');
        const btnToggle = document.getElementById('btnStreamToggle');

        function toggleStream() {
            if (streaming) {
                stopStream();
            } else {
                startStream();
            }
        }

        function startStream() {
            streamImg.src = '/stream?' + Date.now();
            streamImg.classList.add('active');
            btnToggle.textContent = 'Stop Stream';
            btnToggle.classList.remove('btn-success');
            btnToggle.classList.add('btn-danger');
            streaming = true;
        }

        function stopStream() {
            streamImg.src = '';
            streamImg.classList.remove('active');
            btnToggle.textContent = 'Start Stream';
            btnToggle.classList.remove('btn-danger');
            btnToggle.classList.add('btn-success');
            streaming = false;
        }

        function snapshot() {
            window.open('/snapshot?' + Date.now(), '_blank');
        }

        function showStatus(msg, type) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = 'status ' + type;
            status.style.display = 'block';
            if (type !== 'loading') {
                setTimeout(() => { status.style.display = 'none'; }, 2000);
            }
        }

        // Apply a single setting immediately (no flash save)
        async function applySetting(id, value) {
            const wasStreaming = streaming;

            // Stop stream BEFORE changing setting so camera can reconfigure
            if (wasStreaming) {
                stopStream();
                await new Promise(r => setTimeout(r, 200));
            }

            const params = new URLSearchParams();
            params.set(id, value);
            try {
                await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });
            } catch (err) {
                showStatus('Error: ' + err, 'error');
            }

            // Restart stream after setting applied
            if (wasStreaming) {
                await new Promise(r => setTimeout(r, 100));
                startStream();
            }
        }

        // Attach change handlers to all inputs
        function setupChangeHandlers() {
            ['fd', 'q', 'b', 'c', 's', 'ael', 'aecv', 'agcg'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('change', () => applySetting(id, el.value));
            });
            ['fs', 'e', 'wbm', 'gcl'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('change', () => applySetting(id, el.value));
            });
            ['wb', 'awbg', 'ec', 'aec2', 'gc', 'bpc', 'wpc', 'rg', 'lenc', 'hm', 'vm', 'dcw', 'cb', 'me'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('change', () => applySetting(id, el.checked ? '1' : '0'));
            });
            // Motion detection settings (no stream restart needed)
            ['ms', 'mc', 'mt'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('change', () => applyMotionSetting(id, el.value));
            });
        }

        // Apply motion setting without restarting stream
        async function applyMotionSetting(id, value) {
            const params = new URLSearchParams();
            params.set(id, value);
            try {
                await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });
            } catch (err) {
                showStatus('Error: ' + err, 'error');
            }
        }

        async function loadSettings() {
            showStatus('Loading...', 'loading');
            try {
                const resp = await fetch('/api/settings');
                const data = await resp.json();

                // Populate form
                document.getElementById('fd').value = data.fd;
                document.getElementById('fs').value = data.fs;
                document.getElementById('q').value = data.q;
                document.getElementById('b').value = data.b;
                document.getElementById('b').nextElementSibling.textContent = data.b;
                document.getElementById('c').value = data.c;
                document.getElementById('c').nextElementSibling.textContent = data.c;
                document.getElementById('s').value = data.s;
                document.getElementById('s').nextElementSibling.textContent = data.s;
                document.getElementById('e').value = data.e;
                document.getElementById('wb').checked = data.wb === 1;
                document.getElementById('awbg').checked = data.awbg === 1;
                document.getElementById('wbm').value = data.wbm;
                document.getElementById('ec').checked = data.ec === 1;
                document.getElementById('aec2').checked = data.aec2 === 1;
                document.getElementById('ael').value = data.ael;
                document.getElementById('ael').nextElementSibling.textContent = data.ael;
                document.getElementById('aecv').value = data.aecv;
                document.getElementById('gc').checked = data.gc === 1;
                document.getElementById('agcg').value = data.agcg;
                document.getElementById('gcl').value = data.gcl;
                document.getElementById('bpc').checked = data.bpc === 1;
                document.getElementById('wpc').checked = data.wpc === 1;
                document.getElementById('rg').checked = data.rg === 1;
                document.getElementById('lenc').checked = data.lenc === 1;
                document.getElementById('hm').checked = data.hm === 1;
                document.getElementById('vm').checked = data.vm === 1;
                document.getElementById('dcw').checked = data.dcw === 1;
                document.getElementById('cb').checked = data.cb === 1;

                // Motion detection settings
                document.getElementById('me').checked = data.me === 1;
                document.getElementById('ms').value = data.ms;
                document.getElementById('ms').nextElementSibling.textContent = data.ms;
                document.getElementById('mc').value = data.mc;
                document.getElementById('mt').value = data.mt;

                showStatus('Loaded', 'success');
            } catch (err) {
                showStatus('Failed to load: ' + err, 'error');
            }
        }

        async function saveToFlash() {
            showStatus('Saving to flash...', 'loading');
            const params = new URLSearchParams();
            params.set('save', '1');
            // Send all current values
            params.set('fd', document.getElementById('fd').value);
            params.set('fs', document.getElementById('fs').value);
            params.set('q', document.getElementById('q').value);
            params.set('b', document.getElementById('b').value);
            params.set('c', document.getElementById('c').value);
            params.set('s', document.getElementById('s').value);
            params.set('e', document.getElementById('e').value);
            params.set('wb', document.getElementById('wb').checked ? '1' : '0');
            params.set('awbg', document.getElementById('awbg').checked ? '1' : '0');
            params.set('wbm', document.getElementById('wbm').value);
            params.set('ec', document.getElementById('ec').checked ? '1' : '0');
            params.set('aec2', document.getElementById('aec2').checked ? '1' : '0');
            params.set('ael', document.getElementById('ael').value);
            params.set('aecv', document.getElementById('aecv').value);
            params.set('gc', document.getElementById('gc').checked ? '1' : '0');
            params.set('agcg', document.getElementById('agcg').value);
            params.set('gcl', document.getElementById('gcl').value);
            params.set('bpc', document.getElementById('bpc').checked ? '1' : '0');
            params.set('wpc', document.getElementById('wpc').checked ? '1' : '0');
            params.set('rg', document.getElementById('rg').checked ? '1' : '0');
            params.set('lenc', document.getElementById('lenc').checked ? '1' : '0');
            params.set('hm', document.getElementById('hm').checked ? '1' : '0');
            params.set('vm', document.getElementById('vm').checked ? '1' : '0');
            params.set('dcw', document.getElementById('dcw').checked ? '1' : '0');
            params.set('cb', document.getElementById('cb').checked ? '1' : '0');
            // Motion detection settings
            params.set('me', document.getElementById('me').checked ? '1' : '0');
            params.set('ms', document.getElementById('ms').value);
            params.set('mc', document.getElementById('mc').value);
            params.set('mt', document.getElementById('mt').value);

            try {
                const resp = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });
                const data = await resp.json();
                if (data.status === 'ok') {
                    showStatus('Saved to flash!', 'success');
                } else {
                    showStatus('Error saving', 'error');
                }
            } catch (err) {
                showStatus('Failed: ' + err, 'error');
            }
        }

        // Motion status polling
        let motionPollInterval = null;
        const motionIndicator = document.getElementById('motionStatus');

        async function pollMotionStatus() {
            if (!document.getElementById('me').checked) {
                motionIndicator.className = 'motion-indicator';
                return;
            }
            try {
                const resp = await fetch('/api/motion');
                const data = await resp.json();
                if (data.detected) {
                    motionIndicator.className = 'motion-indicator detected';
                } else if (data.ready) {
                    motionIndicator.className = 'motion-indicator ready';
                } else {
                    motionIndicator.className = 'motion-indicator';
                }
            } catch (e) {
                motionIndicator.className = 'motion-indicator';
            }
        }

        function startMotionPolling() {
            if (!motionPollInterval) {
                motionPollInterval = setInterval(pollMotionStatus, 500);
            }
        }

        function stopMotionPolling() {
            if (motionPollInterval) {
                clearInterval(motionPollInterval);
                motionPollInterval = null;
            }
        }

        // Initialize
        loadSettings();
        setupChangeHandlers();
        startMotionPolling();
    </script>
</body>
</html>
